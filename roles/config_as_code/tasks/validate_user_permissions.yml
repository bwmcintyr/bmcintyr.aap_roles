---
# EDA passes the git user's email address in 'config_as_code_user_email'.
# A launch from the AAP UI does not, so the launching user (tower_user_id) is the requester.
- name: Determine how the requesting user is identified
  ansible.builtin.set_fact:
    _cac_lookup_by_email: "{{ config_as_code_user_email | default('', true) | length > 0 }}"

- name: Identify the requesting user
  when: not config_as_code_no_limit | bool
  block:
    - name: Fail when launched by EDA without an email address
      when: ansible_eda is defined
      ansible.builtin.assert:
        that: _cac_lookup_by_email
        fail_msg: |
          The job was launched by EDA but 'config_as_code_user_email' is empty.
          Ensure the rulebook passes the git user's email address from the event.

    - name: Fail when no user can be identified
      ansible.builtin.assert:
        that: _cac_lookup_by_email or tower_user_id is defined
        fail_msg: |
          Cannot validate user permissions without one of these defined:
          config_as_code_user_email | tower_user_id

    # Launched by EDA
    - name: Find the AAP user by email address
      when: _cac_lookup_by_email
      block:
        - name: Search for users with the email address
          ansible.builtin.set_fact:
            _controller_users_by_email: "{{ query('ansible.controller.controller_api', 'users', query_params={'email__iexact': config_as_code_user_email}) }}"

        - name: Fail unless exactly one user has the email address
          ansible.builtin.assert:
            that: _controller_users_by_email | length == 1
            fail_msg: |
              Expected one AAP user with email address {{ config_as_code_user_email }}, found {{ _controller_users_by_email | length }}.
              Please ensure the user exists in AAP and their email address is unique.

        - name: Use the user found by email address
          ansible.builtin.set_fact:
            _controller_user: "{{ _controller_users_by_email | first }}"

    # Launched from the AAP UI
    - name: Use the user who launched the job
      when: not _cac_lookup_by_email
      ansible.builtin.set_fact:
        _controller_user: "{{ lookup('ansible.controller.controller_api', 'users/' + tower_user_id | string) }}"

    - name: Proceed without limits for a superuser
      when: _controller_user['is_superuser']
      ansible.builtin.set_fact:
        config_as_code_no_limit: true

    - name: Get user organizations
      when: not config_as_code_no_limit | bool
      ansible.builtin.set_fact:
        _controller_user_organizations: >-
          {{ lookup('ansible.controller.controller_api', 'users/' + _controller_user['id'] | string + '/organizations/',
             return_objects=false, return_all=true)['results'] | map(attribute='name') | list }}

...
